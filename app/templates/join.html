{% extends "public.html" %}
{% block title %}Join Homeplate{% endblock %}
{% block content %}
<h1>Join Homeplate</h1>
<form method="post" action="/join/{{ token }}" class="card">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <label>Name <input name="name" autocomplete="name" required value="{{ v.get('name', '') }}"></label>
  <label>Email <input name="email" type="email" autocomplete="email" required value="{{ v.get('email', '') }}"></label>
  <label>Username <input name="username" autocomplete="username" required value="{{ v.get('username', '') }}"></label>
  <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Confirm password <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button>Create account</button>
</form>
{% endblock %}
