services:
  homeplate:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      MEALIE_URL: http://mealie:9000
      MEALIE_PUBLIC_URL: http://localhost:9925
      SECRET_KEY: ${SECRET_KEY:-change-me}
      BASE_URL: http://localhost:8000
      TZ: America/Indiana/Indianapolis
      DATA_DIR: /data
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    ports:
      - "9925:9000"
    environment:
      ALLOW_SIGNUP: "false"
      TZ: America/Indiana/Indianapolis
